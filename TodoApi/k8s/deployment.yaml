apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-api
  labels:
    app: todo-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: todo-api
  template:
    metadata:
      labels:
        app: todo-api
    spec:
      containers:
        - name: todo-api
          image: yourname/todo-api:v1   # replace with your Docker Hub image
          ports:
            - containerPort: 8080
          env:
            # From ConfigMap
            - name: ASPNETCORE_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: todo-api-config
                  key: ASPNETCORE_ENVIRONMENT
            - name: App__LogLevel
              valueFrom:
                configMapKeyRef:
                  name: todo-api-config
                  key: App__LogLevel
            # From Secret
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: todo-api-secret
                  key: ConnectionStrings__DefaultConnection
            - name: ApiKey
              valueFrom:
                secretKeyRef:
                  name: todo-api-secret
                  key: ApiKey
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /api/todo
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
