<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Todo App</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 500px; margin: 40px auto; padding: 0 16px; }
        h1 { font-size: 1.5rem; }
        form { display: flex; gap: 8px; margin-bottom: 20px; }
        input[type="text"] { flex: 1; padding: 6px; font-size: 1rem; border: 1px solid #ccc; }
        button { padding: 6px 14px; cursor: pointer; }
        ul { list-style: none; padding: 0; }
        li { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid #eee; }
        .done { text-decoration: line-through; color: #888; }
        a { font-size: 0.85rem; color: #555; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <h1>My Todo List</h1>

    <form action="/add" method="post">
        <input type="text" name="title" placeholder="What needs to be done?" required>
        <button type="submit">Add</button>
    </form>

    <ul>
        {% for todo in todos %}
        <li>
            <a href="/toggle/{{ todo.id }}">
                [{{ 'x' if todo.done else ' ' }}]
            </a>
            <span class="{{ 'done' if todo.done else '' }}">{{ todo.title }}</span>
            <a href="/delete/{{ todo.id }}" style="margin-left:auto; color:red;">delete</a>
        </li>
        {% endfor %}
        {% if not todos %}
        <li style="color:#aaa;">No todos yet. Add one above.</li>
        {% endif %}
    </ul>
</body>
</html>
